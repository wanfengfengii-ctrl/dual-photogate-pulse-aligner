# 包装线脉冲配对：纯后端 API。
#
#   docker compose up build          # 构建并启动 api
#   docker compose up --abort-on-container-exit verify   # 跑一次性验收
#
# api 容器内固定监听 8080；宿主机端口由环境变量 API_PORT 覆盖（默认 8080）。
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: packageline-api:latest
    container_name: packageline-api
    environment:
      # 仅控制容器内监听端口；对外映射见 ports。
      API_PORT: "8080"
    ports:
      # 宿主端口可用 API_PORT 覆盖，默认 8080；容器内端口恒为 8080。
      - "${API_PORT:-8080}:8080"
    restart: unless-stopped
    healthcheck:
      # 不引入额外业务路由；直接用 TCP 连通性判定就绪。
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 3s

  # 一次性验收服务：启动后通过容器网络访问 api，跑完 Go testing 即退出。
  verify:
    image: packageline-api:latest
    container_name: packageline-verify
    depends_on:
      api:
        condition: service_healthy
    environment:
      MATCH_API_BASE_URL: "http://api:8080"
    entrypoint: ["/usr/local/bin/acceptance.test", "-test.v"]
    restart: "no"
